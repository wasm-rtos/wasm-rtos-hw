name: Build

# The devices build with the interpreter's header and nothing else
# (hw_host.h is what they need from an operating system), with warnings as
# errors, by clang and gcc. Their tests run with the kernel in
# wasm-rtos-tests.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The interpreter's header
        run: git clone --depth 1 https://github.com/wasm-rtos/wasm-rtos-vm "$RUNNER_TEMP/vm"

      # The public API at 1.0 (docs/api-1.0.txt): names are only added.
      - name: Check the API
        run: python3 tools/check-api.py

      - name: Build alone
        run: |
          for cc in clang gcc; do
            for system in 1 0; do
              for file in *.c; do
                $cc -std=c11 -O2 -Wall -Wextra -Wno-unused-parameter -Werror -DHW_HAS_SYSTEM=$system \
                  -I"$RUNNER_TEMP/vm/source" -c "$file" -o "$RUNNER_TEMP/$file.o" || exit 1
              done
            done
            $cc -std=c11 -O2 -Wall -Wextra -Wno-unused-parameter -Werror -DHW_HAS_SYSTEM=0 \
              -I"$RUNNER_TEMP/vm/source" -c single/hw_host_single.c -o "$RUNNER_TEMP/single.o" || exit 1
            echo "ok   $cc"
          done

      # The simple host runs a program on the interpreter and the devices, no
      # kernel (the whole mini OS is in wasm-rtos-examples).
      - name: The simple host
        run: |
          cd test/single
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -O1 -g -fsanitize=address,undefined -Wall -Wextra -Werror \
            -Wno-unused-parameter -DHW_HAS_SYSTEM=0 -I"$RUNNER_TEMP/vm/source" -I../.. \
            main.c ../../*.c ../../single/*.c "$RUNNER_TEMP"/vm/source/wm_*.c -lm -o "$RUNNER_TEMP/single"
          "$RUNNER_TEMP/single"

      # AVR has no 32-bit atomics: the devices and the simple host build there (hw_isr.h).
      - name: Build for an ATmega328P
        run: |
          sudo apt-get install -y gcc-avr avr-libc >/dev/null
          for file in *.c single/*.c; do
            avr-gcc -mmcu=atmega328p -Os -std=gnu99 -Wall -Wextra -Werror -Wno-unused-parameter -DHW_HAS_SYSTEM=0 \
              -I"$RUNNER_TEMP/vm/source" -I. -c "$file" -o "$RUNNER_TEMP/avr.o" || exit 1
          done
          echo "ok   avr-gcc"
